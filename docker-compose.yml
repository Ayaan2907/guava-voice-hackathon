services:
  postgres:
    image: postgres:16-alpine
    container_name: pact-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    volumes:
      - pact_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pact_pg:
